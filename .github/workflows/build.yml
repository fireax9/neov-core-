name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configure Environment & Missing Files
      run: |
        SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
        echo "sdk.dir=$SDK_PATH" > local.properties
        yes | "$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
        if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
          echo 'rootProject.name = "NeovCore"' > settings.gradle.kts
          echo 'include(":app")' >> settings.gradle.kts
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Neov-Core-APK
        path: "**/build/outputs/apk/debug/*.apk"
        if-no-files-found: error
